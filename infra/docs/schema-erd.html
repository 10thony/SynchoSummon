const DATA = JSON.parse(document.getElementById('schema-data').textContent);
const COLORS = {
  facility: getComputedStyle(document.documentElement).getPropertyValue('--facility').trim(),
  flight: getComputedStyle(document.documentElement).getPropertyValue('--flight').trim(),
  equipment: getComputedStyle(document.documentElement).getPropertyValue('--equipment').trim(),
  weather: getComputedStyle(document.documentElement).getPropertyValue('--weather').trim(),
  auth: getComputedStyle(document.documentElement).getPropertyValue('--auth').trim(),
  simulation: getComputedStyle(document.documentElement).getPropertyValue('--simulation').trim(),
  eval: getComputedStyle(document.documentElement).getPropertyValue('--eval').trim(),
  perf: getComputedStyle(document.documentElement).getPropertyValue('--perf').trim(),
  lookup: getComputedStyle(document.documentElement).getPropertyValue('--lookup').trim(),
  other: getComputedStyle(document.documentElement).getPropertyValue('--other').trim(),
};

const svg = document.getElementById('canvas');
const NS = 'http://www.w3.org/2000/svg';
const detail = document.getElementById('detail');
const tableList = document.getElementById('tableList');
const domainFilter = document.getElementById('domainFilter');
const stats = document.getElementById('stats');

const domains = [...new Set(DATA.tables.map(t => t.domain))].sort();
domains.forEach(d => {
  const opt = document.createElement('option');
  opt.value = d; opt.textContent = d;
  domainFilter.appendChild(opt);
});

stats.textContent = `${DATA.tableCount} tables · ${DATA.fkCount} foreign keys · generated ${DATA.generated}`;

let selected = null; // pinned by click (toggle)
let hovered = null;  // temporary hover preview
let transform = { x: 40, y: 40, k: 1 };
let nodes = [];
let links = [];

function domainColor(d) { return COLORS[d] || COLORS.other; }

function relatedSet(name) {
  const related = new Set([name]);
  const edges = [];
  DATA.fks.forEach(f => {
    if (f.from === name || f.to === name) {
      related.add(f.from);
      related.add(f.to);
      edges.push(f);
    }
  });
  return { related, edges };
}

function activeFocus() {
  // While pinned, hover is disabled — pin owns focus exclusively.
  return selected || hovered;
}

const measureCtx = document.createElement('canvas').getContext('2d');
function measureText(text, font) {
  measureCtx.font = font;
  return Math.ceil(measureCtx.measureText(text).width);
}

function nodeMetrics(t) {
  const padX = 24;
  const title = t.name;
  const domainLine = t.domain;
  const pkLine = t.pk ? `pk ${t.pk}` : '';
  const titleW = measureText(title, '600 12px "Segoe UI", system-ui, sans-serif');
  const domainW = measureText(domainLine, '400 10px "Segoe UI", system-ui, sans-serif');
  const pkW = pkLine ? measureText(pkLine, '400 10px "Segoe UI", system-ui, sans-serif') : 0;
  const w = Math.max(160, titleW, domainW, pkW) + padX;
  const h = pkLine ? 64 : 48;
  return { title, domainLine, pkLine, w, h };
}

function layout(tables) {
  const byDomain = {};
  tables.forEach(t => {
    (byDomain[t.domain] ||= []).push(t);
  });
  const domainOrder = ['lookup','facility','flight','equipment','weather','auth','simulation','eval','perf','other']
    .filter(d => byDomain[d]);
  const placed = [];
  const GAPX = 28, GAPY = 24, ROW_MAX = 1280;
  let y = 0;
  domainOrder.forEach(domain => {
    const list = byDomain[domain].sort((a,b) => a.name.localeCompare(b.name));
    let x = 0;
    let rowH = 0;
    list.forEach((t) => {
      const m = nodeMetrics(t);
      if (x > 0 && x + m.w > ROW_MAX) {
        x = 0;
        y += rowH + GAPY;
        rowH = 0;
      }
      placed.push({
        ...t,
        ...m,
        x,
        y,
      });
      x += m.w + GAPX;
      rowH = Math.max(rowH, m.h);
    });
    y += rowH + 52;
  });
  return placed;
}

function rebuildList(tables) {
  tableList.innerHTML = '';
  tables.slice().sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
    const el = document.createElement('div');
    el.className = 'table-item' + (selected === t.name ? ' selected' : '');
    el.dataset.name = t.name;
    el.innerHTML = `<span class="dot" style="background:${domainColor(t.domain)}"></span>${t.name}`;
    el.onclick = () => togglePin(t.name);
    el.onmouseenter = () => setHover(t.name);
    el.onmouseleave = () => setHover(null);
    tableList.appendChild(el);
  });
}

function edgePath(a, b) {
  const x1 = a.x + a.w / 2, y1 = a.y + a.h;
  const x2 = b.x + b.w / 2, y2 = b.y;
  const mid = (y1 + y2) / 2;
  if (Math.abs(y2 - y1) < 8) {
    return `M ${a.x + a.w} ${a.y + a.h/2} C ${a.x + a.w + 40} ${a.y + a.h/2}, ${b.x - 40} ${b.y + b.h/2}, ${b.x} ${b.y + b.h/2}`;
  }
  return `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
}

function render() {
  const filter = domainFilter.value;
  const tables = DATA.tables.filter(t => filter === 'all' || t.domain === filter);
  nodes = layout(tables);
  const nameSet = new Set(nodes.map(n => n.name));
  const byName = Object.fromEntries(nodes.map(n => [n.name, n]));
  links = DATA.fks.filter(fk => nameSet.has(fk.from) && nameSet.has(fk.to));

  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const root = document.createElementNS(NS, 'g');
  root.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.k})`);
  svg.appendChild(root);

  const linkG = document.createElementNS(NS, 'g');
  root.appendChild(linkG);
  links.forEach(fk => {
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', edgePath(byName[fk.from], byName[fk.to]));
    path.setAttribute('class', 'link');
    path.dataset.from = fk.from;
    path.dataset.to = fk.to;
    linkG.appendChild(path);
  });

  const nodeG = document.createElementNS(NS, 'g');
  root.appendChild(nodeG);
  nodes.forEach(n => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node');
    g.dataset.name = n.name;
    g.style.cursor = 'pointer';
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', n.x); rect.setAttribute('y', n.y);
    rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);
    rect.setAttribute('stroke', domainColor(n.domain));
    const title = document.createElementNS(NS, 'text');
    title.setAttribute('class', 'title');
    title.setAttribute('x', n.x + 12); title.setAttribute('y', n.y + 20);
    title.textContent = n.title || n.name;
    const meta = document.createElementNS(NS, 'text');
    meta.setAttribute('class', 'meta');
    meta.setAttribute('x', n.x + 12); meta.setAttribute('y', n.y + 36);
    meta.textContent = n.domainLine || n.domain;
    g.appendChild(rect); g.appendChild(title); g.appendChild(meta);
    if (n.pkLine) {
      const pk = document.createElementNS(NS, 'text');
      pk.setAttribute('class', 'pk');
      pk.setAttribute('x', n.x + 12); pk.setAttribute('y', n.y + 52);
      pk.textContent = n.pkLine;
      g.appendChild(pk);
    }
    g.addEventListener('pointerenter', () => setHover(n.name));
    g.addEventListener('pointerleave', () => setHover(null));
    g.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      togglePin(n.name);
    });
    nodeG.appendChild(g);
  });

  rebuildList(tables);
  applyHighlight();
  updateDetail();
}

function setHover(name) {
  // Pin locks the graph: ignore hover until pin is cleared or changed via click
  if (selected) return;
  if (hovered === name) return;
  hovered = name;
  applyHighlight();
  updateDetail();
}

function togglePin(name) {
  if (selected === name) {
    selected = null;
    hovered = null;
  } else {
    selected = name;
    hovered = null; // disable hover while pinned
  }
  applyHighlight();
  updateDetail();
}

function clearPin() {
  selected = null;
  hovered = null;
  applyHighlight();
  updateDetail();
}

function focusMode(focus) {
  if (selected && focus === selected) return 'pin';
  if (hovered) return 'hover';
  return null;
}

let detailFocusKey = null;
function updateDetail() {
  const focus = activeFocus();
  if (!focus) {
    detail.style.display = 'none';
    detailFocusKey = null;
    return;
  }
  const mode = focusMode(focus);
  const key = focus + ':' + mode;
  // Avoid rewriting the panel (resets scroll) when focus hasn't changed
  if (key === detailFocusKey && detail.style.display === 'block') return;
  detailFocusKey = key;

  const t = DATA.tables.find(x => x.name === focus);
  if (!t) { detail.style.display = 'none'; return; }
  const outs = DATA.fks.filter(f => f.from === focus);
  const ins = DATA.fks.filter(f => f.to === focus);
  const badge = mode === 'pin'
    ? '<span class="pin-badge">pinned</span>'
    : '<span class="pin-badge" style="border-color:var(--muted);color:var(--muted)">hover</span>';
  detail.style.display = 'block';
  detail.innerHTML = `
    <h3>${t.name}${badge}</h3>
    <div><code>${t.file}</code> · domain <strong>${t.domain}</strong></div>
    <p style="margin:10px 0 4px;color:var(--muted);font-size:12px">Connected tables</p>
    <div class="fk-row"><strong>${outs.length}</strong> outgoing · <strong>${ins.length}</strong> incoming</div>
    <p style="margin:10px 0 4px;color:var(--muted);font-size:12px">Columns (sample)</p>
    <div>${(t.cols || []).map(c => `<code style="display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;border:1px solid var(--stroke);border-radius:4px">${c}</code>`).join('')}</div>
    <p style="margin:12px 0 4px;color:var(--muted);font-size:12px">References out (${outs.length})</p>
    ${outs.map(f => `<div class="fk-row">${f.col} → <strong>${f.to}</strong>.${f.toCol}</div>`).join('') || '<div class="fk-row">None</div>'}
    <p style="margin:12px 0 4px;color:var(--muted);font-size:12px">Referenced by (${ins.length})</p>
    ${ins.map(f => `<div class="fk-row"><strong>${f.from}</strong>.${f.col} → ${f.toCol}</div>`).join('') || '<div class="fk-row">None</div>'}
  `;
}

function applyHighlight() {
  const focus = activeFocus();
  const mode = focusMode(focus);
  const { related } = focus ? relatedSet(focus) : { related: new Set() };

  document.querySelectorAll('.table-item').forEach(el => {
    const name = el.dataset.name;
    el.classList.toggle('selected', name === selected);
    el.style.opacity = focus && !related.has(name) ? '0.35' : '1';
  });

  svg.querySelectorAll('.node').forEach(n => {
    const name = n.dataset.name;
    n.classList.toggle('dim', !!(focus && !related.has(name)));
    n.classList.toggle('focus', name === focus);
    n.classList.toggle('neighbor', !!(focus && related.has(name) && name !== focus));
  });

  svg.querySelectorAll('.link').forEach(l => {
    const hit = !!(focus && (l.dataset.from === focus || l.dataset.to === focus));
    l.classList.remove('highlight-hover', 'highlight-pin', 'dim');
    if (hit && mode === 'pin') l.classList.add('highlight-pin');
    else if (hit && mode === 'hover') l.classList.add('highlight-hover');
    else if (focus) l.classList.add('dim');
  });

  if (focus) {
    const outs = DATA.fks.filter(f => f.from === focus).length;
    const ins = DATA.fks.filter(f => f.to === focus).length;
    const tag = mode === 'pin' ? 'pinned' : 'hover';
    stats.textContent = `${focus}: ${outs} out · ${ins} in · ${related.size - 1} neighbors (${tag})`;
  } else {
    stats.textContent = `${DATA.tableCount} tables · ${DATA.fkCount} foreign keys · generated ${DATA.generated}`;
  }
}

domainFilter.addEventListener('change', () => {
  selected = null;
  hovered = null;
  detail.style.display = 'none';
  render();
});
document.getElementById('resetView').onclick = () => { transform = { x: 40, y: 40, k: 1 }; render(); };
document.getElementById('fitView').onclick = () => {
  if (!nodes.length) return;
  const maxX = Math.max(...nodes.map(n => n.x + n.w));
  const maxY = Math.max(...nodes.map(n => n.y + n.h));
  const vbW = svg.clientWidth || 900, vbH = svg.clientHeight || 600;
  const k = Math.min((vbW - 80) / maxX, (vbH - 80) / maxY, 1.2);
  transform = { x: 40, y: 40, k };
  render();
};
document.getElementById('clearPin').onclick = () => clearPin();

function eventOnNode(target) {
  if (!target || !target.closest) return null;
  return target.closest('.node');
}

// Pan only on empty canvas — never capture pointer on nodes (that stole clicks)
let dragging = false, didDrag = false, last = null, downPos = null;
svg.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.detail')) return;
  if (eventOnNode(e.target)) return; // let node handle click/hover
  dragging = true;
  didDrag = false;
  downPos = { x: e.clientX, y: e.clientY };
  last = { x: e.clientX, y: e.clientY };
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointerup', () => { dragging = false; });
svg.addEventListener('pointercancel', () => { dragging = false; });
svg.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - last.x;
  const dy = e.clientY - last.y;
  if (!didDrag && downPos) {
    const total = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    if (total > 5) didDrag = true;
  }
  if (!didDrag) return;
  transform.x += dx;
  transform.y += dy;
  last = { x: e.clientX, y: e.clientY };
  const g = svg.querySelector('g');
  if (g) g.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.k})`);
});
svg.addEventListener('click', (e) => {
  if (didDrag) return;
  if (eventOnNode(e.target)) return;
  if (selected) clearPin();
});
function applyTransform() {
  const g = svg.querySelector('g');
  if (g) g.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.k})`);
}

// Wheel pans the canvas; Ctrl/Meta+wheel zooms. Works while pinned.
function onCanvasWheel(e) {
  // Let the detail panel scroll its own content
  if (e.target.closest && e.target.closest('.detail')) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    transform.k = Math.min(2.5, Math.max(0.35, transform.k * delta));
  } else {
    // Trackpads send deltaX/deltaY; mouse wheels mostly deltaY
    transform.x -= e.deltaX;
    transform.y -= e.deltaY;
  }
  applyTransform();
}
svg.addEventListener('wheel', onCanvasWheel, { passive: false });
document.querySelector('main').addEventListener('wheel', onCanvasWheel, { passive: false });

render();
</script>
</body>
</html>
